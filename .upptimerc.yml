owner: GT-SASE
repo: buzz-status

# Only fully static pages: they are served from Vercel's CDN, so a check every
# five minutes never runs a function or wakes the Neon database. The home and
# events pages revalidate hourly against the database, and /api/health runs a
# query, so probing them would keep compute warm.
sites:
  - name: Website
    url: https://buzzsase.vercel.app/about
  - name: Contact page
    url: https://buzzsase.vercel.app/contact

status-website:
  baseUrl: /buzz-status
  name: SASE at Georgia Tech status
  introTitle: "**buzzsase.vercel.app** uptime"
  introMessage: Checked every five minutes from GitHub Actions.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://buzzsase.vercel.app
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
